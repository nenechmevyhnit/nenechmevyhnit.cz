name: Kontrola
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Identita commitů (jen push do main)
        if: github.event_name == 'push'
        run: bash scripts/over-identitu.sh "${{ github.event.before }}..${{ github.sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Validace skutečného obsahu
        run: npm run over
      - name: Build produkční verze
        run: npx astro build
      - name: Jednotkové testy
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E2E testy
        run: npm run e2e
      - name: Změněné kauzy a pravidla
        id: zmeny
        run: echo "soubory=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- 'obsah/kauzy/*.md' 'obsah/pravidla/*.md' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Kontrola odkazů ve změněných kauzách a pravidlech
        if: steps.zmeny.outputs.soubory != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml ${{ steps.zmeny.outputs.soubory }}
          fail: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
